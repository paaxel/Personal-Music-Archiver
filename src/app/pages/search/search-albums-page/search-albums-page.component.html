<div class="search-albums-page-container">
  <!-- Breadcrumb Navigation -->
  <div class="breadcrumb">
    <span class="breadcrumb-item" (click)="backToArtists()">{{ 'search.title' | translate }}</span>
    <span class="breadcrumb-separator">›</span>
    <span class="breadcrumb-item active">{{ artist?.name }}</span>
  </div>

  <!-- Albums Section -->
  <div class="albums-section">
    <div class="section-header">
      <h2>{{ 'search.albumsBy' | translate }} {{ artist?.name }}</h2>
      <div class="header-actions">
        <button class="filter-button" (click)="toggleSearchFilters()" [class.active]="showSearchFilters">
          🔧 {{ 'search.filters' | translate }}
        </button>
        <button class="sort-button" (click)="toggleSort()" *ngIf="artistAlbums.length > 0">
          <span *ngIf="searchAlbumsService.sortDescending">↓ {{ 'search.newestFirst' | translate }}</span>
          <span *ngIf="!searchAlbumsService.sortDescending">↑ {{ 'search.oldestFirst' | translate }}</span>
        </button>
      </div>
    </div>

    <!-- Search Filters Panel -->
    <div class="search-filters" *ngIf="showSearchFilters">
      <div class="filter-group">
        <label class="filter-label">{{ 'search.releaseTypes' | translate }}</label>
        <div class="filter-chips">
          <button 
            *ngFor="let type of availablePrimaryTypes"
            class="filter-chip"
            [class.selected]="isPrimaryTypeSelected(type)"
            (click)="togglePrimaryType(type)"
          >
            {{ type }}
          </button>
        </div>
      </div>
      <div class="filter-group">
        <label class="filter-label">{{ 'search.excludeTypes' | translate }}</label>
        <div class="filter-chips">
          <button 
            *ngFor="let type of availableSecondaryTypes"
            class="filter-chip exclude"
            [class.selected]="isSecondaryTypeExcluded(type)"
            (click)="toggleExcludeSecondaryType(type)"
          >
            {{ type }}
          </button>
        </div>
      </div>
      <button class="apply-filters-btn" (click)="applySearchFilters()">
        {{ 'search.applyFilters' | translate }}
      </button>
    </div>

    <div *ngIf="artistAlbums.length === 0" class="empty-state">
      <p>{{ 'search.noAlbums' | translate }}</p>
    </div>

    <div *ngIf="artistAlbums.length > 0" class="albums-grid">
      <div 
        *ngFor="let album of artistAlbums" 
        class="album-card"
        [class.added]="isAlbumAdded(album.id)"
        (click)="onAlbumClick(album)"
      >
        <div class="album-placeholder">
          <span class="album-icon">💿</span>
        </div>
        <div class="album-info">
          <h3 class="album-title">{{ album.title }}</h3>
          <p class="album-year">{{ getReleaseYear(album) }}</p>
          
          <button
            class="archive-btn"
            [class.archiving]="isAlbumArchiving(album.id)"
            [class.added]="isAlbumAdded(album.id)"
            (click)="onArchiveAlbum(album, $event)"
            [disabled]="isAlbumArchiving(album.id) || isAlbumAdded(album.id)"
          >
            <span *ngIf="!isAlbumArchiving(album.id) && !isAlbumAdded(album.id)">⬇ {{ 'search.archiveCard' | translate }}</span>
            <span *ngIf="isAlbumArchiving(album.id)">
              <span class="download-spinner"></span>
              {{ 'search.archivingCard' | translate }}
            </span>
            <span *ngIf="isAlbumAdded(album.id)">✓ {{ 'search.albumAddedCard' | translate }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
